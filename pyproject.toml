[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "sms/tests", "model/tests", "mcp/tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    "data/no2/**",
    "data/rainfall/**",
    "data/ndvi/**",
    "outreach/_archived/**",
    "_dev_archive/**",
    "pytest-cache-files-*/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",
    "E402",
    "E702",
    "F404",
    "B007",
    "B017",
    "B904",
    "B905",
    "UP007",
]
