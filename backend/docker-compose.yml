services:
  postgres:
    image: postgis/postgis:14-3.3
    container_name: trellis-backend-db
    environment:
      POSTGRES_USER: trellis
      POSTGRES_PASSWORD: trellis
      POSTGRES_DB: trellis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trellis -d trellis"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    container_name: trellis-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trellis:trellis@postgres:5432/trellis
      TRELLIS_SKIP_HMAC: "1"   # development mode; set to 0 + provision secrets for production
      WARDS_GPKG: /data/trellis_delta_wards.gpkg
      FORECAST_PATH: /data/forecast_may_2026.json
    ports:
      - "8001:8001"
    volumes:
      - ../data/trellis_delta_wards.gpkg:/data/trellis_delta_wards.gpkg:ro
      - ../mvp/forecast_may_2026.json:/data/forecast_may_2026.json:ro
    restart: unless-stopped

volumes:
  postgres-data:
