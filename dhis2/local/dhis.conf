# Trellis local DHIS2 configuration
# Mounted into the dhis2 container at /opt/dhis2/dhis.conf
# These values match the postgres service defined in docker-compose.yml.
# This is a LOCAL DEVELOPMENT config; rotate the encryption password before any non-local use.

# ------- Database -------
connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://postgres:5432/dhis
connection.username = dhis
connection.password = dhis

# ------- Encryption -------
# Used to encrypt sensitive data at rest. MUST be at least 24 characters.
# Change this if you ever expose the instance beyond localhost.
encryption.password = trellis-local-dev-key-change-this-now

# ------- Server -------
server.base.url = http://localhost:8080
server.https = off

# ------- Connection pool -------
connection.pool.max_size = 40
connection.pool.initial_size = 5
connection.pool.min_size = 5
connection.pool.max_idle_time = 7200
connection.pool.acquire_incr = 5

# ------- File store (local filesystem) -------
filestore.provider = filesystem
filestore.container = files
