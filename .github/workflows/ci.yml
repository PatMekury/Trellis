name: Trellis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .

  test-backend:
    name: Sensor backend smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:14-3.3
        env:
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis
          POSTGRES_DB: trellis
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r backend/requirements.txt
      - name: Smoke test
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:5432/trellis
          TRELLIS_SKIP_HMAC: "1"
        working-directory: backend
        run: |
          # Start the backend in background (cwd is backend/, so 'app:app' resolves)
          PYTHONPATH=. uvicorn app:app --port 8001 &
          sleep 8
          curl -f http://localhost:8001/
          curl -f http://localhost:8001/sensors
      - name: Run backend unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:5432/trellis
        run: |
          pip install pytest pytest-asyncio
          PYTHONPATH=. pytest tests/ -v

  test-sms:
    name: SMS dispatcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r sms/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Test
        working-directory: sms
        run: |
          cp ../mvp/forecast_may_2026.json forecast.json
          PYTHONPATH=. pytest tests/ -v

  test-model:
    name: Forecast model artefact tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pytest joblib xgboost pandas
      - name: Test
        working-directory: model
        run: PYTHONPATH=. pytest tests/ -v

  validate-forecast-shape:
    name: Forecast JSON shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Validate
        run: |
          python -c "
          import json
          required = {'lganame','wardname','no2_forecast_umol_m2','tier','forecast_year','forecast_month'}
          fc = json.load(open('mvp/forecast_may_2026.json'))
          for f in fc:
              missing = required - set(f.keys())
              assert not missing, f'{f.get(\"wardname\")}: missing {missing}'
          assert len(fc) == 51, f'expected 51 wards, got {len(fc)}'
          print(f'forecast OK: {len(fc)} wards')
          "
