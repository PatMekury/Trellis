; PlatformIO project configuration for Trellis sensor node
; Builds for ESP32-DevKitC v4 (the AirGradient reference MCU)
; Run: pio run -t upload
; Monitor: pio device monitor

[env:trellis_node]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    plerup/EspSoftwareSerial@^8.2.0
    https://github.com/airgradienthq/arduino.git
    https://github.com/Sensirion/arduino-i2c-sgp41.git
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8

board_build.partitions = no_ota.csv

; Optional: SD-card buffer for offline mode
; lib_deps_extra = arduino-libraries/SD@^1.2.4
